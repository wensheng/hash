[package]
name = "hashcli"
version = "0.5.4"
edition = "2024"
rust-version = "1.88"
description = "Hash - Intelligent CLI system with dual-mode functionality (LLM chat and command proxy)"
license = "MIT"
authors = ["Wensheng Wang"]
readme = "README.md"
repository = "https://github.com/wensheng/hash"
keywords = ["cli", "llm", "assistant", "terminal", "shell"]
categories = ["command-line-utilities"]

[lib]
name = "hashcli"
path = "src/lib.rs"

[[bin]]
name = "hashcli"
path = "src/main.rs"

[[bin]]
name = "hi"
path = "src/bin/hi.rs"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
console = "0.16.6"
dialoguer = "0.12.0"
dirs = "7.0.0"
futures-util = "0.3.34"
include_dir = "0.7.4"
indicatif = "0.18.6"
percent-encoding = "2.3.2"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = [
  "json",
  "stream",
  "rustls-no-provider",
  "http2",
  "system-proxy",
] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false, features = [
  "ring",
  "std",
  "tls12",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = [
  "rt",
  "macros",
  "process",
  "time",
  "io-util",
  "io-std",
] }
toml = "1.1.8"
toml_edit = "0.25.17"
uuid = { version = "1.26.1", features = ["v4"] }
which = "8.0.6"
zip = { version = "9", default-features = false, features = [
  "deflate-flate2-zlib-rs",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[target."cfg(unix)".dependencies]
nix = { version = "0.31.3", features = ["term", "process"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = [
  "rt",
  "macros",
  "process",
  "time",
  "rt-multi-thread",
] }
toml = "1.1.8"
which = "8.0.6"
wiremock = "0.6.5"
